---
apiVersion: v1
kind: ConfigMap
metadata:
  name: generic-device-plugin-configmap
data:
  config.yaml: |
    devices:
      - name: tun
        groups:
          - count: 1000
            paths:
              - path: /dev/net/tun

      # - name: coral
      #   groups:
      #     - paths:
      #         - path: /dev/apex_0

      - name: dri
        groups:
          - count: 10
            paths:
              - path: /dev/dri
