# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: media
spec:
  releaseName: plex
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  dependsOn:
    - name: generic-device-plugin
      namespace: kube-system
  values:
    controllers:
      main:
        type: deployment
        strategy: Recreate
        containers:
          main:
            image:
              repository: linuxserver/plex
              tag: 1.43.5@sha256:31e4c2de666cd130bc389133b6c63af08912559d992370e52822f8f229185aef
            env:
              TZ: ${TIMEZONE}
              PUID: "10000"
              PGID: "10000"
            resources:
              requests:
                cpu: 49m
                memory: 2048M
                squat.ai/dri: 1
              limits:
                memory: 4046M
                squat.ai/dri: 1

    service:
      main:
        controller: main
        ports:
          http:
            port: 32400

    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: plex-config
      media:
        enabled: true
        existingClaim: nfs-media-pvc
      transcode:
        enabled: true
        type: emptyDir

    defaultPodOptions:
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: "OnRootMismatch"
